<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Gerçekçi Kaza Simülatörü</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050505;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #1e1e24;
            z-index: 1;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 999;
            border: 1px solid rgba(255,255,255,0.15);
            backdrop-filter: blur(4px);
        }
        .btn-group {
            position: absolute;
            top: 15px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 999;
        }
        .top-btn {
            padding: 10px 18px;
            font-size: 13px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            touch-action: manipulation;
        }
        #fullscreen-btn { background-color: #0288d1; }
        #restart-btn { background-color: #d32f2f; }

        .touch-layer {
            position: absolute;
            bottom: 10px;
            left: 0;
            width: 100%;
            height: 150px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            z-index: 999;
            pointer-events: none;
        }
        .control-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .touch-btn {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.65);
            border: 3px solid rgba(255, 255, 255, 0.4);
            color: white;
            font-size: 28px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.6);
        }
        .touch-btn:active, .touch-btn.active {
            background: rgba(211, 47, 47, 0.85) !important;
            border-color: #fff;
            transform: scale(0.92);
        }

        #portrait-warning {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #111; z-index: 9999;
            flex-direction: column; justify-content: center; align-items: center; text-align: center;
        }
        @media (orientation: portrait) {
            #portrait-warning { display: flex; }
        }
    </style>
</head>
<body>

<div id="portrait-warning">
    <h2>🔄 Lütfen Cihazınızı Yatay Çevirin</h2>
    <p style="margin-top: 10px; color: #888;">Gerçekçi kaza deneyimi için yatay ekran gereklidir.</p>
</div>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div><strong>Hız:</strong> <span id="speedo">0</span> km/h</div>
        <div><strong>Gövde Hasarı:</strong> %<span id="damage">0</span></div>
    </div>

    <div class="btn-group">
        <button id="fullscreen-btn" class="top-btn" onclick="toggleFullscreen()">Tam Ekran</button>
        <button id="restart-btn" class="top-btn" onclick="resetGame()">Baştan Başlat</button>
    </div>

    <div class="touch-layer">
        <div class="control-group">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <div class="control-group">
            <div class="touch-btn" id="btn-down" style="border-color: #ef5350;">▼</div>
            <div class="touch-btn" id="btn-up" style="border-color: #66bb6a;">▲</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const speedoEl = document.getElementById('speedo');
const damageEl = document.getElementById('damage');

let width, height;
let shakeAmount = 0;
let particles = [];

function resizeCanvas() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    setupWalls();
}

let walls = [];
const wallThickness = 24;

function setupWalls() {
    walls = [
        { x: 0, y: 0, w: width, h: wallThickness },
        { x: 0, y: height - wallThickness, w: width, h: wallThickness },
        { x: 0, y: 0, w: wallThickness, h: height },
        { x: width - wallThickness, y: 0, w: wallThickness, h: height },
        // Engel Blokları
        { x: width * 0.4, y: height * 0.25, w: width * 0.2, h: 40 },
        { x: width * 0.25, y: height * 0.6, w: 40, h: height * 0.25 },
        { x: width * 0.7, y: height * 0.5, w: 40, h: height * 0.3 }
    ];
}

window.addEventListener('resize', resizeCanvas);
const keys = { Up: false, Down: false, Left: false, Right: false };

// Parça ve Kıvılcım Efekt Sistemi
class Particle {
    constructor(x, y, vx, vy, color, size, life, isSpark = false) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.size = size;
        this.maxLife = life;
        this.life = life;
        this.isSpark = isSpark;
    }

    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vx *= 0.95;
        this.vy *= 0.95;
        this.life--;
    }

    draw() {
        ctx.save();
        ctx.globalAlpha = this.life / this.maxLife;
        ctx.fillStyle = this.color;
        if (this.isSpark) {
            ctx.shadowBlur = 8;
            ctx.shadowColor = '#ffaa00';
        }
        ctx.fillRect(this.x - this.size/2, this.y - this.size/2, this.size, this.size);
        ctx.restore();
    }
}

// Gelişmiş Araba Sınıfı (Soft-Body Yamulma Fizikli)
class Car {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = width ? width / 2 : 300;
        this.y = height ? height / 2 + 100 : 300;
        this.width = 42;
        this.height = 76;
        this.angle = 0;
        this.speed = 0;
        this.maxSpeed = 8.5;
        this.reverseSpeed = -3;
        this.acceleration = 0.18;
        this.friction = 0.035;
        this.turnSpeed = 0.048;
        this.totalDamage = 0;

        // 32 Noktalı Yüksek Detaylı Gövde Mesh'i
        this.mesh = [];
        const resolution = 32;
        for (let i = 0; i < resolution; i++) {
            const rad = (i / resolution) * Math.PI * 2;
            // Dikdörtgen formu elipse benzetip ölçekleme
            let rx = Math.cos(rad) * (this.width / 2);
            let ry = Math.sin(rad) * (this.height / 2);

            // Köşeleri dikdörtgene benzetme
            rx = Math.sign(rx) * Math.min(Math.abs(rx), this.width / 2);
            ry = Math.sign(ry) * Math.min(Math.abs(ry), this.height / 2);

            this.mesh.push({
                ox: rx, // Orijinal Offset X
                oy: ry, // Orijinal Offset Y
                x: rx,  // Yamulan Offset X
                y: ry   // Yamulan Offset Y
            });
        }
    }

    update() {
        if (keys.Up) {
            if (this.speed < this.maxSpeed) this.speed += this.acceleration;
        } else if (keys.Down) {
            if (this.speed > this.reverseSpeed) this.speed -= this.acceleration;
        } else {
            if (this.speed > 0) {
                this.speed -= this.friction;
                if (this.speed < 0) this.speed = 0;
            } else if (this.speed < 0) {
                this.speed += this.friction;
                if (this.speed > 0) this.speed = 0;
            }
        }

        if (Math.abs(this.speed) > 0.1) {
            const dir = this.speed >= 0 ? 1 : -1;
            if (keys.Left) this.angle -= this.turnSpeed * dir * (Math.abs(this.speed) / this.maxSpeed + 0.2);
            if (keys.Right) this.angle += this.turnSpeed * dir * (Math.abs(this.speed) / this.maxSpeed + 0.2);
        }

        this.x += Math.sin(this.angle) * this.speed;
        this.y -= Math.cos(this.angle) * this.speed;

        this.checkCollisions();

        speedoEl.innerText = Math.round(Math.abs(this.speed) * 16);
        damageEl.innerText = Math.min(100, Math.round(this.totalDamage));
    }

    // Ekrandaki Dünya Koordinatlarına Dönüştürme
    getWorldMesh() {
        return this.mesh.map(m => {
            const rx = m.x * Math.cos(this.angle) - m.y * Math.sin(this.angle);
            const ry = m.x * Math.sin(this.angle) + m.y * Math.cos(this.angle);

            return {
                x: this.x + rx,
                y: this.y + ry,
                node: m
            };
        });
    }

    checkCollisions() {
        const worldNodes = this.getWorldMesh();

        for (let wall of walls) {
            for (let vn of worldNodes) {
                if (vn.x >= wall.x && vn.x <= wall.x + wall.w &&
                    vn.y >= wall.y && vn.y <= wall.y + wall.h) {
                    
                    this.handleCrash(vn, wall);
                    break;
                }
            }
        }
    }

    handleCrash(hitNode, wall) {
        const impact = Math.abs(this.speed);

        if (impact > 0.4) {
            this.totalDamage += impact * 3.5;
            shakeAmount = Math.min(25, impact * 3);

            if (navigator.vibrate) {
                navigator.vibrate(Math.min(250, impact * 40));
            }

            // Gelişmiş Gerçekçi Yamulma Algoritması (Darbe Yayılımı)
            const nodeOffset = hitNode.node;
            
            // Çarpan noktaya göre içeri ezilme vektörü
            const indentX = -nodeOffset.x * (impact * 0.08);
            const indentY = -nodeOffset.y * (impact * 0.08);

            this.mesh.forEach(m => {
                const dist = Math.hypot(m.ox - nodeOffset.ox, m.oy - nodeOffset.oy);
                if (dist < 28) {
                    const factor = (28 - dist) / 28;
                    // Tıpkı sac metal gibi içe göçme
                    m.x += (indentX + (Math.random() - 0.5) * impact * 2) * factor;
                    m.y += (indentY + (Math.random() - 0.5) * impact * 2) * factor;
                }
            });

            // Parça / Kıvılcım Saçma
            const sparkCount = Math.floor(impact * 6);
            for (let i = 0; i < sparkCount; i++) {
                const pAngle = Math.random() * Math.PI * 2;
                const pSpeed = Math.random() * impact * 2 + 1;
                particles.push(new Particle(
                    hitNode.x, hitNode.y,
                    Math.cos(pAngle) * pSpeed, Math.sin(pAngle) * pSpeed,
                    '#ffcc00', Math.random() * 3 + 1, 20 + Math.random() * 20, true
                ));
            }

            // Kopan Araba Boyası / Enkaz Parçaları
            if (impact > 2) {
                for (let i = 0; i < Math.floor(impact * 2); i++) {
                    const pAngle = Math.random() * Math.PI * 2;
                    const pSpeed = Math.random() * impact * 1.5;
                    particles.push(new Particle(
                        hitNode.x, hitNode.y,
                        Math.cos(pAngle) * pSpeed, Math.sin(pAngle) * pSpeed,
                        '#c62828', Math.random() * 4 + 2, 40 + Math.random() * 30
                    ));
                }
            }
        }

        // Çarpışma Tepkisi (Geri Tepme)
        this.speed = -this.speed * 0.3;
        this.x -= Math.sin(this.angle) * (impact + 2);
        this.y += Math.cos(this.angle) * (impact + 2);
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // 1. Far Işıkları
        if (this.totalDamage < 85) {
            ctx.save();
            ctx.fillStyle = 'rgba(255, 245, 157, 0.15)';
            ctx.beginPath();
            ctx.moveTo(-12, -35);
            ctx.lineTo(-30, -120);
            ctx.lineTo(0, -120);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(12, -35);
            ctx.lineTo(30, -120);
            ctx.lineTo(0, -120);
            ctx.closePath();
            ctx.fill();
            ctx.restore();
        }

        // 2. Gölge
        ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
        ctx.beginPath();
        ctx.moveTo(this.mesh[0].x + 5, this.mesh[0].y + 5);
        for (let i = 1; i < this.mesh.length; i++) {
            ctx.lineTo(this.mesh[i].x + 5, this.mesh[i].y + 5);
        }
        ctx.closePath();
        ctx.fill();

        // 3. Tekerlekler
        ctx.fillStyle = '#111';
        const wW = 6, wH = 13;
        ctx.fillRect(-this.width/2 - 2, -this.height/3, wW, wH);
        ctx.fillRect(this.width/2 - 4, -this.height/3, wW, wH);
        ctx.fillRect(-this.width/2 - 2, this.height/3 - wH, wW, wH);
        ctx.fillRect(this.width/2 - 4, this.height/3 - wH, wW, wH);

        // 4. Yamulan Kırmızı Gövde (Soft-Body Mesh Çizimi)
        ctx.fillStyle = '#d32f2f';
        ctx.strokeStyle = '#8e0000';
        ctx.lineWidth = 2.5;

        ctx.beginPath();
        ctx.moveTo(this.mesh[0].x, this.mesh[0].y);
        for (let i = 1; i < this.mesh.length; i++) {
            ctx.lineTo(this.mesh[i].x, this.mesh[i].y);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 5. Tavan ve Ön Cam
        ctx.fillStyle = '#111';
        ctx.fillRect(-this.width * 0.28, -this.height * 0.1, this.width * 0.56, this.height * 0.25);
        
        ctx.fillStyle = '#4fc3f7';
        ctx.globalAlpha = 0.6;
        ctx.fillRect(-this.width * 0.24, -this.height * 0.08, this.width * 0.48, this.height * 0.08);
        ctx.globalAlpha = 1.0;

        ctx.restore();
    }
}

let car;

function drawWalls() {
    ctx.fillStyle = '#ff6600';
    ctx.shadowBlur = 12;
    ctx.shadowColor = 'rgba(255, 102, 0, 0.4)';

    for (let wall of walls) {
        ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
    }
    ctx.shadowBlur = 0;
}

function setupTouchButton(id, keyName) {
    const btn = document.getElementById(id);

    const start = (e) => {
        if (e.cancelable) e.preventDefault();
        keys[keyName] = true;
        btn.classList.add('active');
    };

    const end = (e) => {
        if (e.cancelable) e.preventDefault();
        keys[keyName] = false;
        btn.classList.remove('active');
    };

    btn.addEventListener('touchstart', start, { passive: false });
    btn.addEventListener('touchend', end, { passive: false });
    btn.addEventListener('touchcancel', end, { passive: false });

    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
}

setupTouchButton('btn-up', 'Up');
setupTouchButton('btn-down', 'Down');
setupTouchButton('btn-left', 'Left');
setupTouchButton('btn-right', 'Right');

window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Up = true;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.Down = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;
    if (e.key === 'r' || e.key === 'R') resetGame();
});

window.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Up = false;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.Down = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
});

function toggleFullscreen() {
    const doc = window.document;
    const docEl = doc.documentElement;

    const requestFullscreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
    const exitFullscreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

    if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFullscreen) requestFullscreen.call(docEl);
    } else {
        if (exitFullscreen) exitFullscreen.call(doc);
    }
}

function resetGame() {
    particles = [];
    car.reset();
}

resizeCanvas();
car = new Car();

// Oyun Döngüsü
function gameLoop() {
    ctx.save();

    // Çarpışma Ekran Sallantısı
    if (shakeAmount > 0) {
        const sx = (Math.random() - 0.5) * shakeAmount;
        const sy = (Math.random() - 0.5) * shakeAmount;
        ctx.translate(sx, sy);
        shakeAmount *= 0.88;
        if (shakeAmount < 0.5) shakeAmount = 0;
    }

    ctx.clearRect(0, 0, width, height);

    drawWalls();

    // Parça Güncellemeleri
    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) {
            particles.splice(i, 1);
        }
    }

    car.update();
    car.draw();

    ctx.restore();
    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
