<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2D Araba Kaza Simülatörü</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background-color: #1a1a1a;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border-radius: 8px;
            overflow: hidden;
        }
        canvas {
            background-color: #2b2b2b;
            display: block;
        }
        #ui {
            position: absolute;
            top: 15px;
            left: 15px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.6);
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 14px;
        }
        #restart-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: bold;
            background-color: #ff5722;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        #restart-btn:hover {
            background-color: #e64a19;
        }
        #restart-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="900" height="600"></canvas>
    
    <div id="ui">
        <div><strong>Hız:</strong> <span id="speedo">0</span> km/h</div>
        <div><strong>Hasar:</strong> %<span id="damage">0</span></div>
        <div style="margin-top: 5px; font-size: 11px; opacity: 0.8;">
            Kontroller: Yön Tuşları / WASD<br>
            Yeniden Başlat: R Tuşu
        </div>
    </div>

    <button id="restart-btn" onclick="resetGame()">Baştan Başlat</button>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const speedoEl = document.getElementById('speedo');
const damageEl = document.getElementById('damage');

// Klavye Tuş Durumları
const keys = {
    Up: false,
    Down: false,
    Left: false,
    Right: false
};

// Turuncu Duvar Sınırları
const wallThickness = 20;
const walls = [
    { x: 0, y: 0, w: canvas.width, h: wallThickness }, // Üst
    { x: 0, y: canvas.height - wallThickness, w: canvas.width, h: wallThickness }, // Alt
    { x: 0, y: 0, w: wallThickness, h: canvas.height }, // Sol
    { x: canvas.width - wallThickness, y: 0, w: wallThickness, h: canvas.height }, // Sağ
    // İç Alandaki Engel Duvarlar
    { x: 300, y: 200, w: 300, h: 30 },
    { x: 150, y: 400, w: 30, h: 150 }
];

// Araba Sınıfı
class Car {
    constructor(x, y) {
        this.startX = x;
        this.startY = y;
        this.reset();
    }

    reset() {
        this.x = this.startX;
        this.y = this.startY;
        this.width = 40;
        this.height = 70;
        this.angle = 0; // Radyan
        this.speed = 0;
        this.maxSpeed = 7;
        this.reverseSpeed = -2.5;
        this.acceleration = 0.15;
        this.friction = 0.04;
        this.turnSpeed = 0.04;
        this.totalDamage = 0;

        // Arabanın Hasar Görebilir Ağ Noktaları (Mesh Vertices)
        // [x, y] oranları (-0.5 ile 0.5 arası)
        this.originalVertices = [
            { x: -0.5, y: -0.5 }, // Sol Ön
            { x: 0,    y: -0.52 },// Ön Burun
            { x: 0.5,  y: -0.5 }, // Sağ Ön
            { x: 0.5,  y: 0 },    // Sağ Sağ Kapı
            { x: 0.5,  y: 0.5 },  // Sağ Arka
            { x: -0.5, y: 0.5 },  // Sol Arka
            { x: -0.5, y: 0 }     // Sol Kapı
        ];

        // Anlık bozulmuş noktalar
        this.vertices = JSON.parse(JSON.stringify(this.originalVertices));
    }

    update() {
        // Hız Kontrolü
        if (keys.Up) {
            if (this.speed < this.maxSpeed) this.speed += this.acceleration;
        } else if (keys.Down) {
            if (this.speed > this.reverseSpeed) this.speed -= this.acceleration;
        } else {
            // Sürtünme Yavaşlaması
            if (this.speed > 0) {
                this.speed -= this.friction;
                if (this.speed < 0) this.speed = 0;
            } else if (this.speed < 0) {
                this.speed += this.friction;
                if (this.speed > 0) this.speed = 0;
            }
        }

        // Direksiyon Dönüşü (Yalnızca araç hareket ederken)
        if (Math.abs(this.speed) > 0.1) {
            const dir = this.speed >= 0 ? 1 : -1;
            if (keys.Left) this.angle -= this.turnSpeed * dir * (Math.abs(this.speed) / this.maxSpeed + 0.2);
            if (keys.Right) this.angle += this.turnSpeed * dir * (Math.abs(this.speed) / this.maxSpeed + 0.2);
        }

        // Pozisyon Güncelleme
        const nextX = this.x + Math.sin(this.angle) * this.speed;
        const nextY = this.y - Math.cos(this.angle) * this.speed;

        this.x = nextX;
        this.y = nextY;

        // Çarpışma Kontrolü
        this.checkCollisions();

        // UI Güncelleme
        speedoEl.innerText = Math.round(Math.abs(this.speed) * 15);
        damageEl.innerText = Math.min(100, Math.round(this.totalDamage));
    }

    // Dünyadaki gerçek köşe koordinatlarını hesaplama
    getWorldVertices() {
        return this.vertices.map(v => {
            const vx = v.x * this.width;
            const vy = v.y * this.height;

            const rx = vx * Math.cos(this.angle) - vy * Math.sin(this.angle);
            const ry = vx * Math.sin(this.angle) + vy * Math.cos(this.angle);

            return {
                x: this.x + rx,
                y: this.y + ry,
                origX: v.x,
                origY: v.y,
                index: this.vertices.indexOf(v)
            };
        });
    }

    checkCollisions() {
        const worldVerts = this.getWorldVertices();

        for (let wall of walls) {
            for (let v of worldVerts) {
                // Nokta duvarın içinde mi?
                if (v.x >= wall.x && v.x <= wall.x + wall.w &&
                    v.y >= wall.y && v.y <= wall.y + wall.h) {
                    
                    this.handleCrash(v, wall);
                    break;
                }
            }
        }
    }

    handleCrash(hitVertex, wall) {
        const impactForce = Math.abs(this.speed);
        
        // Yeterince yüksek bir hızla çarptıysa deforme et
        if (impactForce > 0.5) {
            this.totalDamage += impactForce * 4;

            // Çarpışmanın merkez yönü
            const crashAngle = this.angle;
            
            // Çarpan ve yakınındaki noktaları yamult
            this.vertices.forEach((vert, idx) => {
                const dist = Math.hypot(vert.x - hitVertex.origX, vert.y - hitVertex.origY);
                if (dist < 0.6) {
                    const deformAmount = (impactForce * 0.04) / (dist + 0.5);
                    vert.x += (Math.random() - 0.5) * deformAmount;
                    vert.y += (Math.random() - 0.5) * deformAmount;
                }
            });
        }

        // Çarpışma Tepkisi (Geri Sıçrama)
        this.speed = -this.speed * 0.4;
        
        // Duvarın dışına itme
        this.x -= Math.sin(this.angle) * (impactForce + 2);
        this.y += Math.cos(this.angle) * (impactForce + 2);
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // 1. Gölge
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        const worldVerts = this.vertices;
        ctx.moveTo(worldVerts[0].x * this.width + 5, worldVerts[0].y * this.height + 5);
        for (let i = 1; i < worldVerts.length; i++) {
            ctx.lineTo(worldVerts[i].x * this.width + 5, worldVerts[i].y * this.height + 5);
        }
        ctx.closePath();
        ctx.fill();

        // 2. Tekerlekler
        ctx.fillStyle = '#111';
        const wheelW = 6, wheelH = 12;
        // Sol Ön / Sağ Ön / Sol Arka / Sağ Arka
        ctx.fillRect(-this.width/2 - 2, -this.height/3, wheelW, wheelH);
        ctx.fillRect(this.width/2 - 4, -this.height/3, wheelW, wheelH);
        ctx.fillRect(-this.width/2 - 2, this.height/3 - wheelH, wheelW, wheelH);
        ctx.fillRect(this.width/2 - 4, this.height/3 - wheelH, wheelW, wheelH);

        // 3. Araba Gövdesi (Yamulabilir Poligon)
        ctx.fillStyle = '#d32f2f'; // Kırmızı Spor Araba
        ctx.strokeStyle = '#8e0000';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(worldVerts[0].x * this.width, worldVerts[0].y * this.height);
        for (let i = 1; i < worldVerts.length; i++) {
            ctx.lineTo(worldVerts[i].x * this.width, worldVerts[i].y * this.height);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // 4. Ön Cam ve Tavan Detayı
        ctx.fillStyle = '#222';
        ctx.fillRect(-this.width * 0.3, -this.height * 0.1, this.width * 0.6, this.height * 0.3);
        
        ctx.fillStyle = '#81d4fa'; // Cam yansıması
        ctx.fillRect(-this.width * 0.25, -this.height * 0.08, this.width * 0.5, this.height * 0.1);

        // 5. Far Işıkları (Ön)
        ctx.fillStyle = '#fff59d';
        ctx.fillRect(-this.width * 0.4, -this.height * 0.48, 6, 4);
        ctx.fillRect(this.width * 0.4 - 6, -this.height * 0.48, 6, 4);

        ctx.restore();
    }
}

const car = new Car(450, 450);

// Duvarları Çizme
function drawWalls() {
    ctx.fillStyle = '#ff6600'; // Turuncu Renk
    ctx.shadowBlur = 10;
    ctx.shadowColor = 'rgba(255, 102, 0, 0.5)';

    for (let wall of walls) {
        ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
    }

    ctx.shadowBlur = 0; // Diğer çizimleri etkilemesin
}

// Klavye Dinleyicileri
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Up = true;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.Down = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;
    if (e.key === 'r' || e.key === 'R') resetGame();
});

window.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Up = false;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.Down = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
});

function resetGame() {
    car.reset();
}

// Ana Oyun Döngüsü (Game Loop)
function gameLoop() {
    // Ekranı Temizle
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Çizimler ve Güncellemeler
    drawWalls();
    car.update();
    car.draw();

    requestAnimationFrame(gameLoop);
}

// Oyunu Başlat
gameLoop();
</script>

</body>
  </html>
