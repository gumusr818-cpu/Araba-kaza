<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>2D Mobil Araba Kaza Simülatörü</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #111;
            font-family: Arial, sans-serif;
            color: #fff;
        }
        #game-container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #2b2b2b;
            z-index: 1;
        }
        
        /* UI Üst Bilgi */
        #ui {
            position: absolute;
            top: 10px;
            left: 15px;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 13px;
            z-index: 999;
            border: 1px solid rgba(255,255,255,0.2);
        }

        /* Üst Butonlar (Tam Ekran ve Yeniden Başlat) */
        .btn-group {
            position: absolute;
            top: 10px;
            right: 15px;
            display: flex;
            gap: 10px;
            z-index: 999;
        }
        .top-btn {
            padding: 10px 16px;
            font-size: 13px;
            font-weight: bold;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.5);
            touch-action: manipulation;
        }
        #fullscreen-btn { background-color: #007bff; }
        #restart-btn { background-color: #ff5722; }

        /* Mobil Dokunmatik Kontroller (Ekranın Alt Kısmına Sabitlendi) */
        .touch-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 140px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 25px;
            z-index: 999;
            pointer-events: none;
        }
        .control-group {
            display: flex;
            gap: 15px;
            pointer-events: auto;
        }
        .touch-btn {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: rgba(0, 0, 0, 0.6);
            border: 3px solid rgba(255, 255, 255, 0.6);
            color: white;
            font-size: 26px;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }
        .touch-btn:active, .touch-btn.active {
            background: rgba(255, 87, 34, 0.8) !important;
            border-color: #fff;
            transform: scale(0.95);
        }

        /* Dikey Ekran Uyarısı */
        #portrait-warning {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #111;
            z-index: 9999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }
        @media (orientation: portrait) {
            #portrait-warning { display: flex; }
        }
    </style>
</head>
<body>

<div id="portrait-warning">
    <h2>🔄 Lütfen Cihazınızı Yatay Çevirin</h2>
    <p style="margin-top: 10px; color: #aaa;">En iyi oyun deneyimi için yatay ekran gereklidir.</p>
</div>

<div id="game-container">
    <canvas id="gameCanvas"></canvas>
    
    <div id="ui">
        <div><strong>Hız:</strong> <span id="speedo">0</span> km/h</div>
        <div><strong>Hasar:</strong> %<span id="damage">0</span></div>
    </div>

    <div class="btn-group">
        <button id="fullscreen-btn" class="top-btn" onclick="toggleFullscreen()">Tam Ekran</button>
        <button id="restart-btn" class="top-btn" onclick="resetGame()">Baştan Başlat</button>
    </div>

    <!-- Mobil Dokunmatik Buton Katmanı -->
    <div class="touch-layer">
        <!-- Sol Taraf: Direksiyon (Sağ - Sol) -->
        <div class="control-group">
            <div class="touch-btn" id="btn-left">◀</div>
            <div class="touch-btn" id="btn-right">▶</div>
        </div>
        <!-- Sağ Taraf: Pedallar (Geri - Gaz) -->
        <div class="control-group">
            <div class="touch-btn" id="btn-down" style="border-color: #ff5252;">▼</div>
            <div class="touch-btn" id="btn-up" style="border-color: #4caf50;">▲</div>
        </div>
    </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const speedoEl = document.getElementById('speedo');
const damageEl = document.getElementById('damage');

let width, height;
function resizeCanvas() {
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;
    setupWalls();
}

let walls = [];
const wallThickness = 20;

function setupWalls() {
    walls = [
        { x: 0, y: 0, w: width, h: wallThickness },
        { x: 0, y: height - wallThickness, w: width, h: wallThickness },
        { x: 0, y: 0, w: wallThickness, h: height },
        { x: width - wallThickness, y: 0, w: wallThickness, h: height },
        { x: width * 0.35, y: height * 0.3, w: width * 0.3, h: 25 },
        { x: width * 0.2, y: height * 0.55, w: 25, h: height * 0.25 }
    ];
}

window.addEventListener('resize', resizeCanvas);

const keys = { Up: false, Down: false, Left: false, Right: false };

class Car {
    constructor() {
        this.reset();
    }

    reset() {
        this.x = width ? width / 2 : 300;
        this.y = height ? height / 2 + 50 : 300;
        this.width = 38;
        this.height = 68;
        this.angle = 0;
        this.speed = 0;
        this.maxSpeed = 7.5;
        this.reverseSpeed = -2.5;
        this.acceleration = 0.16;
        this.friction = 0.04;
        this.turnSpeed = 0.045;
        this.totalDamage = 0;

        this.originalVertices = [
            { x: -0.5, y: -0.5 },
            { x: 0,    y: -0.52 },
            { x: 0.5,  y: -0.5 },
            { x: 0.5,  y: 0 },
            { x: 0.5,  y: 0.5 },
            { x: -0.5, y: 0.5 },
            { x: -0.5, y: 0 }
        ];

        this.vertices = JSON.parse(JSON.stringify(this.originalVertices));
    }

    update() {
        if (keys.Up) {
            if (this.speed < this.maxSpeed) this.speed += this.acceleration;
        } else if (keys.Down) {
            if (this.speed > this.reverseSpeed) this.speed -= this.acceleration;
        } else {
            if (this.speed > 0) {
                this.speed -= this.friction;
                if (this.speed < 0) this.speed = 0;
            } else if (this.speed < 0) {
                this.speed += this.friction;
                if (this.speed > 0) this.speed = 0;
            }
        }

        if (Math.abs(this.speed) > 0.1) {
            const dir = this.speed >= 0 ? 1 : -1;
            if (keys.Left) this.angle -= this.turnSpeed * dir * (Math.abs(this.speed) / this.maxSpeed + 0.2);
            if (keys.Right) this.angle += this.turnSpeed * dir * (Math.abs(this.speed) / this.maxSpeed + 0.2);
        }

        this.x += Math.sin(this.angle) * this.speed;
        this.y -= Math.cos(this.angle) * this.speed;

        this.checkCollisions();

        speedoEl.innerText = Math.round(Math.abs(this.speed) * 15);
        damageEl.innerText = Math.min(100, Math.round(this.totalDamage));
    }

    getWorldVertices() {
        return this.vertices.map(v => {
            const vx = v.x * this.width;
            const vy = v.y * this.height;

            const rx = vx * Math.cos(this.angle) - vy * Math.sin(this.angle);
            const ry = vx * Math.sin(this.angle) + vy * Math.cos(this.angle);

            return {
                x: this.x + rx,
                y: this.y + ry,
                origX: v.x,
                origY: v.y
            };
        });
    }

    checkCollisions() {
        const worldVerts = this.getWorldVertices();

        for (let wall of walls) {
            for (let v of worldVerts) {
                if (v.x >= wall.x && v.x <= wall.x + wall.w &&
                    v.y >= wall.y && v.y <= wall.y + wall.h) {
                    
                    this.handleCrash(v);
                    break;
                }
            }
        }
    }

    handleCrash(hitVertex) {
        const impactForce = Math.abs(this.speed);
        
        if (impactForce > 0.5) {
            this.totalDamage += impactForce * 4;

            if (navigator.vibrate) {
                navigator.vibrate(Math.min(200, impactForce * 30));
            }

            this.vertices.forEach(vert => {
                const dist = Math.hypot(vert.x - hitVertex.origX, vert.y - hitVertex.origY);
                if (dist < 0.6) {
                    const deformAmount = (impactForce * 0.04) / (dist + 0.5);
                    vert.x += (Math.random() - 0.5) * deformAmount;
                    vert.y += (Math.random() - 0.5) * deformAmount;
                }
            });
        }

        this.speed = -this.speed * 0.35;
        this.x -= Math.sin(this.angle) * (impactForce + 2);
        this.y += Math.cos(this.angle) * (impactForce + 2);
    }

    draw() {
        ctx.save();
        ctx.translate(this.x, this.y);
        ctx.rotate(this.angle);

        // Gölge
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
        ctx.beginPath();
        ctx.moveTo(this.vertices[0].x * this.width + 4, this.vertices[0].y * this.height + 4);
        for (let i = 1; i < this.vertices.length; i++) {
            ctx.lineTo(this.vertices[i].x * this.width + 4, this.vertices[i].y * this.height + 4);
        }
        ctx.closePath();
        ctx.fill();

        // Tekerlekler
        ctx.fillStyle = '#111';
        const wheelW = 5, wheelH = 11;
        ctx.fillRect(-this.width/2 - 2, -this.height/3, wheelW, wheelH);
        ctx.fillRect(this.width/2 - 3, -this.height/3, wheelW, wheelH);
        ctx.fillRect(-this.width/2 - 2, this.height/3 - wheelH, wheelW, wheelH);
        ctx.fillRect(this.width/2 - 3, this.height/3 - wheelH, wheelW, wheelH);

        // Gövde
        ctx.fillStyle = '#e53935';
        ctx.strokeStyle = '#b71c1c';
        ctx.lineWidth = 2;

        ctx.beginPath();
        ctx.moveTo(this.vertices[0].x * this.width, this.vertices[0].y * this.height);
        for (let i = 1; i < this.vertices.length; i++) {
            ctx.lineTo(this.vertices[i].x * this.width, this.vertices[i].y * this.height);
        }
        ctx.closePath();
        ctx.fill();
        ctx.stroke();

        // Cam
        ctx.fillStyle = '#222';
        ctx.fillRect(-this.width * 0.3, -this.height * 0.1, this.width * 0.6, this.height * 0.28);

        // Farlar
        ctx.fillStyle = '#fff59d';
        ctx.fillRect(-this.width * 0.4, -this.height * 0.48, 5, 4);
        ctx.fillRect(this.width * 0.4 - 5, -this.height * 0.48, 5, 4);

        ctx.restore();
    }
}

let car;

function drawWalls() {
    ctx.fillStyle = '#ff6600';
    for (let wall of walls) {
        ctx.fillRect(wall.x, wall.y, wall.w, wall.h);
    }
}

// Dokunmatik Tuş Yönetimi (Hem Touch hem Mouse destekli)
function setupTouchButton(id, keyName) {
    const btn = document.getElementById(id);

    const start = (e) => {
        if (e.cancelable) e.preventDefault();
        keys[keyName] = true;
        btn.classList.add('active');
    };

    const end = (e) => {
        if (e.cancelable) e.preventDefault();
        keys[keyName] = false;
        btn.classList.remove('active');
    };

    btn.addEventListener('touchstart', start, { passive: false });
    btn.addEventListener('touchend', end, { passive: false });
    btn.addEventListener('touchcancel', end, { passive: false });

    btn.addEventListener('mousedown', start);
    btn.addEventListener('mouseup', end);
    btn.addEventListener('mouseleave', end);
}

setupTouchButton('btn-up', 'Up');
setupTouchButton('btn-down', 'Down');
setupTouchButton('btn-left', 'Left');
setupTouchButton('btn-right', 'Right');

// Klavye Desteği
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Up = true;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.Down = true;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = true;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = true;
    if (e.key === 'r' || e.key === 'R') resetGame();
});

window.addEventListener('keyup', e => {
    if (e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') keys.Up = false;
    if (e.key === 'ArrowDown' || e.key === 's' || e.key === 'S') keys.Down = false;
    if (e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') keys.Left = false;
    if (e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') keys.Right = false;
});

// Tam Ekran Düğmesi
function toggleFullscreen() {
    const doc = window.document;
    const docEl = doc.documentElement;

    const requestFullscreen = docEl.requestFullscreen || docEl.mozRequestFullScreen || docEl.webkitRequestFullScreen || docEl.msRequestFullscreen;
    const exitFullscreen = doc.exitFullscreen || doc.mozCancelFullScreen || doc.webkitExitFullscreen || doc.msExitFullscreen;

    if (!doc.fullscreenElement && !doc.mozFullScreenElement && !doc.webkitFullscreenElement && !doc.msFullscreenElement) {
        if (requestFullscreen) requestFullscreen.call(docEl);
    } else {
        if (exitFullscreen) exitFullscreen.call(doc);
    }
}

function resetGame() {
    car.reset();
}

resizeCanvas();
car = new Car();

function gameLoop() {
    ctx.clearRect(0, 0, width, height);

    drawWalls();
    car.update();
    car.draw();

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
